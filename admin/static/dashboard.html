<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据统计 — 管理后台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .sidebar { width: 200px; min-height: 100vh; background: #1e3a5f; }
    .sidebar a { color: rgba(255,255,255,0.75); text-decoration: none; display: block; padding: 10px 16px; border-radius: 6px; margin: 2px 8px; }
    .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,0.15); color: #fff; }
    .brand { color: #fff; font-weight: 700; padding: 20px 16px 12px; font-size: 0.9rem; }
    .stat-card { border-radius: 12px; padding: 20px; }
  </style>
</head>
<body class="bg-light">
  <div class="d-flex">
    <div class="sidebar d-flex flex-column">
      <div class="brand">Python 管理台</div>
      <a href="dashboard.html" class="active">数据统计</a>
      <a href="users.html">用户管理</a>
      <a href="sessions.html">会话管理</a>
      <a href="lessons.html">课程管理</a>
      <a href="questions.html">题目管理</a>
      <a href="prompts.html">Prompt 管理</a>
      <a href="config.html">模型配置</a>
      <div class="mt-auto p-2">
        <button class="btn btn-sm btn-outline-light w-100" onclick="logout()">退出</button>
      </div>
    </div>
    <div class="flex-grow-1 p-4">
      <h5 class="mb-4 fw-bold">数据统计</h5>
      <div class="row g-3 mb-4">
        <div class="col-md-3">
          <div class="stat-card bg-success bg-opacity-10">
            <div class="h3 fw-bold text-success" id="totalUsers">—</div>
            <div class="text-muted small">总用户数</div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card bg-primary bg-opacity-10">
            <div class="h3 fw-bold text-primary" id="active7d">—</div>
            <div class="text-muted small">近 7 日活跃</div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card bg-warning bg-opacity-10">
            <div class="h3 fw-bold text-warning" id="totalSessions">—</div>
            <div class="text-muted small">总对话次数</div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card bg-danger bg-opacity-10">
            <div class="h3 fw-bold text-danger" id="estimatedTokens">—</div>
            <div class="text-muted small">估计 Token 消耗</div>
          </div>
        </div>
      </div>
      <div class="text-muted small">数据来源：app.db（SQLite）· 每次刷新页面更新</div>
    </div>
  </div>
  <script>
    const TOKEN = localStorage.getItem('admin_token')
    if (!TOKEN) location.href = 'index.html'
    const H = { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' }
    async function apiFetch(path, opts = {}) {
      const res = await fetch(path, { ...opts, headers: H })
      if (res.status === 401) { localStorage.removeItem('admin_token'); location.href = 'index.html' }
      if (!res.ok) throw new Error(await res.text())
      return res.json()
    }
    function logout() { localStorage.removeItem('admin_token'); location.href = 'index.html' }
    apiFetch('/admin/stats').then(data => {
      document.getElementById('totalUsers').textContent = data.total_users.toLocaleString()
      document.getElementById('active7d').textContent = data.active_7d.toLocaleString()
      document.getElementById('totalSessions').textContent = data.total_sessions.toLocaleString()
      const t = data.estimated_tokens
      document.getElementById('estimatedTokens').textContent =
        t >= 1000000 ? (t/1000000).toFixed(1)+'M' : t >= 1000 ? (t/1000).toFixed(1)+'K' : String(t)
    })
  </script>
</body>
</html>
