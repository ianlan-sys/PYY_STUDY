<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python 学习助手 — 管理后台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f4ff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { width: 360px; border-radius: 16px; }
    .brand { color: #1a73e8; font-weight: 700; font-size: 1.1rem; }
  </style>
</head>
<body>
  <div class="card shadow login-card p-4">
    <div class="text-center mb-4">
      <div class="brand">🐍 Python 学习助手</div>
      <div class="text-muted small mt-1">管理后台</div>
    </div>
    <div id="errMsg" class="alert alert-danger d-none"></div>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">用户名</label>
        <input type="text" id="username" class="form-control" placeholder="admin" required>
      </div>
      <div class="mb-3">
        <label class="form-label">密码</label>
        <input type="password" id="password" class="form-control" required>
      </div>
      <button type="submit" id="loginBtn" class="btn btn-primary w-100">登录</button>
    </form>
  </div>
  <script>
    // Redirect if already logged in
    if (localStorage.getItem('admin_token')) location.href = 'dashboard.html'

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault()
      const btn = document.getElementById('loginBtn')
      const err = document.getElementById('errMsg')
      btn.disabled = true; btn.textContent = '登录中…'
      err.classList.add('d-none')
      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        })
        if (!res.ok) throw new Error('用户名或密码错误')
        const data = await res.json()
        localStorage.setItem('admin_token', data.access_token)
        location.href = 'dashboard.html'
      } catch (ex) {
        err.textContent = ex.message
        err.classList.remove('d-none')
        btn.disabled = false; btn.textContent = '登录'
      }
    })
  </script>
</body>
</html>
