<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>课程管理 — 管理后台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .sidebar { width: 200px; min-height: 100vh; background: #1e3a5f; }
    .sidebar a { color: rgba(255,255,255,0.75); text-decoration: none; display: block; padding: 10px 16px; border-radius: 6px; margin: 2px 8px; }
    .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,0.15); color: #fff; }
    .brand { color: #fff; font-weight: 700; padding: 20px 16px 12px; font-size: 0.9rem; }
  </style>
</head>
<body class="bg-light">
  <div class="d-flex">
    <div class="sidebar d-flex flex-column">
      <div class="brand">Python 管理台</div>
      <a href="dashboard.html">数据统计</a>
      <a href="users.html">用户管理</a>
      <a href="sessions.html">会话管理</a>
      <a href="lessons.html" class="active">课程管理</a>
      <a href="questions.html">题目管理</a>
      <a href="prompts.html">Prompt 管理</a>
      <a href="config.html">模型配置</a>
      <div class="mt-auto p-2">
        <button class="btn btn-sm btn-outline-light w-100" onclick="logout()">退出</button>
      </div>
    </div>

    <div class="flex-grow-1 p-4">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <h5 class="fw-bold mb-0">课程管理</h5>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#createModal">+ 新增节点</button>
      </div>
      <p class="text-muted small mb-4">点击「生成」调用 AI 生成课程内容并存入数据库，小程序自动拉取。</p>

      <div class="card">
        <div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr><th>节点 ID</th><th>标题</th><th>阶段</th><th>类型</th><th>最后生成时间</th><th></th></tr>
            </thead>
            <tbody id="lessonTable"></tbody>
          </table>
        </div>
      </div>

      <div id="preview" class="mt-4 d-none">
        <h6 class="fw-bold">生成预览 — <span id="previewTitle"></span></h6>
        <div id="previewContent"></div>
      </div>
    </div>
  </div>

  <!-- 新增节点 Modal -->
  <div class="modal fade" id="createModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title fw-bold">新增课程节点</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">节点 ID <small class="text-muted">（英文+下划线，唯一）</small></label>
            <input id="newNodeId" class="form-control font-monospace" placeholder="例：intermediate_list_1">
          </div>
          <div class="mb-3">
            <label class="form-label">课程标题</label>
            <input id="newTitle" class="form-control" placeholder="例：列表与元组">
          </div>
          <div class="mb-3">
            <label class="form-label">阶段</label>
            <select id="newPhase" class="form-select">
              <option value="入门">入门</option>
              <option value="进阶">进阶</option>
              <option value="高级">高级</option>
            </select>
          </div>
          <div id="createError" class="alert alert-danger d-none small"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button class="btn btn-primary" id="createBtn" onclick="createLesson()">生成并保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const TOKEN = localStorage.getItem('admin_token')
    if (!TOKEN) location.href = 'index.html'
    const H = { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' }
    async function apiFetch(path, opts = {}) {
      const res = await fetch(path, { ...opts, headers: H })
      if (res.status === 401) { localStorage.removeItem('admin_token'); location.href = 'index.html' }
      if (!res.ok) throw new Error(await res.text())
      return res.json()
    }
    function logout() { localStorage.removeItem('admin_token'); location.href = 'index.html' }

    function showPreview(data) {
      document.getElementById('previewTitle').textContent = data.title
      document.getElementById('previewContent').innerHTML = data.sections.map(s => `
        <div class="card mb-3">
          <div class="card-body">
            <h6 class="fw-bold text-primary">${s.heading}</h6>
            <p class="mb-2" style="white-space:pre-wrap">${s.body}</p>
            ${s.code ? `<pre class="bg-dark text-light p-3 rounded small mb-0">${s.code}</pre>` : ''}
          </div>
        </div>`).join('')
      document.getElementById('preview').classList.remove('d-none')
      document.getElementById('preview').scrollIntoView({ behavior: 'smooth' })
    }

    async function loadLessons() {
      const data = await apiFetch('/admin/lessons')
      document.getElementById('lessonTable').innerHTML = data.map(l => `
        <tr id="row-${CSS.escape(l.node_id)}">
          <td class="font-monospace small">${l.node_id}</td>
          <td>${l.title}</td>
          <td><span class="badge bg-secondary">${l.phase}</span></td>
          <td><span class="badge ${l.builtin ? 'bg-info' : 'bg-success'} bg-opacity-75">${l.builtin ? '内置' : '自定义'}</span></td>
          <td class="small text-muted">${l.generated_at ? l.generated_at.slice(0,19).replace('T',' ') : '—'}</td>
          <td class="d-flex gap-1">
            <button class="btn btn-sm ${l.generated_at ? 'btn-outline-primary' : 'btn-primary'}"
              onclick="regenerate('${l.node_id}', this)">
              ${l.generated_at ? '重新生成' : '生成'}
            </button>
            ${!l.builtin ? `<button class="btn btn-sm btn-outline-danger" onclick="deleteLesson('${l.node_id}')">删除</button>` : ''}
          </td>
        </tr>`).join('')
    }

    async function regenerate(nodeId, btn) {
      const orig = btn.textContent
      btn.textContent = '生成中…'; btn.disabled = true
      document.getElementById('preview').classList.add('d-none')
      try {
        const data = await apiFetch(`/admin/lessons/generate/${nodeId}`, { method: 'POST' })
        showPreview(data)
        await loadLessons()
      } catch(e) {
        alert('生成失败：' + e.message)
        btn.textContent = orig; btn.disabled = false
      }
    }

    async function createLesson() {
      const node_id = document.getElementById('newNodeId').value.trim()
      const title   = document.getElementById('newTitle').value.trim()
      const phase   = document.getElementById('newPhase').value
      const errEl   = document.getElementById('createError')
      const btn     = document.getElementById('createBtn')
      if (!node_id || !title) { errEl.textContent = '节点 ID 和标题不能为空'; errEl.classList.remove('d-none'); return }
      errEl.classList.add('d-none')
      btn.disabled = true; btn.textContent = 'AI 生成中…'
      try {
        const data = await apiFetch('/admin/lessons', { method: 'POST', body: JSON.stringify({ node_id, title, phase }) })
        bootstrap.Modal.getInstance(document.getElementById('createModal')).hide()
        document.getElementById('newNodeId').value = ''
        document.getElementById('newTitle').value = ''
        showPreview(data)
        await loadLessons()
      } catch(e) {
        errEl.textContent = '创建失败：' + e.message
        errEl.classList.remove('d-none')
      } finally {
        btn.disabled = false; btn.textContent = '生成并保存'
      }
    }

    async function deleteLesson(nodeId) {
      if (!confirm(`确定删除节点 "${nodeId}"？此操作不可恢复。`)) return
      try {
        await apiFetch(`/admin/lessons/${nodeId}`, { method: 'DELETE' })
        await loadLessons()
        document.getElementById('preview').classList.add('d-none')
      } catch(e) {
        alert('删除失败：' + e.message)
      }
    }

    loadLessons()
  </script>
</body>
</html>
