<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prompt 管理 — 管理后台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .sidebar { width: 200px; min-height: 100vh; background: #1e3a5f; }
    .sidebar a { color: rgba(255,255,255,0.75); text-decoration: none; display: block; padding: 10px 16px; border-radius: 6px; margin: 2px 8px; }
    .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,0.15); color: #fff; }
    .brand { color: #fff; font-weight: 700; padding: 20px 16px 12px; font-size: 0.9rem; }
  </style>
</head>
<body class="bg-light">
  <div class="d-flex">
    <div class="sidebar d-flex flex-column">
      <div class="brand">Python 管理台</div>
      <a href="dashboard.html">数据统计</a>
      <a href="users.html">用户管理</a>
      <a href="sessions.html">会话管理</a>
      <a href="lessons.html">课程管理</a>
      <a href="questions.html">题目管理</a>
      <a href="prompts.html" class="active">Prompt 管理</a>
      <a href="config.html">模型配置</a>
      <div class="mt-auto p-2">
        <button class="btn btn-sm btn-outline-light w-100" onclick="logout()">退出</button>
      </div>
    </div>
    <div class="flex-grow-1 p-4">
      <h5 class="fw-bold mb-3">Prompt 管理</h5>
      <div class="alert alert-info small">修改后立即生效，无需重启服务。</div>
      <div id="promptList"></div>
    </div>
  </div>
  <script>
    const TOKEN = localStorage.getItem('admin_token')
    if (!TOKEN) location.href = 'index.html'
    const H = { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' }
    async function apiFetch(path, opts = {}) {
      const res = await fetch(path, { ...opts, headers: H })
      if (res.status === 401) { localStorage.removeItem('admin_token'); location.href = 'index.html' }
      if (!res.ok) throw new Error(await res.text())
      return res.json()
    }
    function logout() { localStorage.removeItem('admin_token'); location.href = 'index.html' }
    const KEY_LABEL = {
      chat_base: '通用问答 System Prompt',
      code_suffix: '代码解释 追加内容',
      error_suffix: '错误诊断 追加内容'
    }
    async function savePrompt(key) {
      const content = document.getElementById('ta_' + key).value
      const btn = document.getElementById('btn_' + key)
      btn.disabled = true; btn.textContent = '保存中…'
      try {
        await apiFetch('/admin/prompts/' + key, { method: 'PUT', body: JSON.stringify({ content }) })
        btn.textContent = '已保存'
        setTimeout(() => { btn.textContent = '保存'; btn.disabled = false }, 2000)
      } catch(e) {
        btn.textContent = '保存失败'; btn.disabled = false
      }
    }
    apiFetch('/admin/prompts').then(prompts => {
      document.getElementById('promptList').innerHTML = prompts.map(p => `
        <div class="card mb-3">
          <div class="card-header fw-semibold">${KEY_LABEL[p.key] || p.key}</div>
          <div class="card-body">
            <textarea id="ta_${p.key}" class="form-control font-monospace small" rows="5">${p.content}</textarea>
            <div class="d-flex justify-content-between align-items-center mt-2">
              <small class="text-muted">最后更新：${p.updated_at.slice(0,16)}</small>
              <button id="btn_${p.key}" class="btn btn-sm btn-primary" onclick="savePrompt('${p.key}')">保存</button>
            </div>
          </div>
        </div>`).join('')
    })
  </script>
</body>
</html>
