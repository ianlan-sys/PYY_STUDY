<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>题目管理 — 管理后台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .sidebar { width: 200px; min-height: 100vh; background: #1e3a5f; }
    .sidebar a { color: rgba(255,255,255,0.75); text-decoration: none; display: block; padding: 10px 16px; border-radius: 6px; margin: 2px 8px; }
    .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,0.15); color: #fff; }
    .brand { color: #fff; font-weight: 700; padding: 20px 16px 12px; font-size: 0.9rem; }
    .option-correct { color: #198754; font-weight: 600; }
  </style>
</head>
<body class="bg-light">
  <div class="d-flex">
    <div class="sidebar d-flex flex-column">
      <div class="brand">Python 管理台</div>
      <a href="dashboard.html">数据统计</a>
      <a href="users.html">用户管理</a>
      <a href="sessions.html">会话管理</a>
      <a href="lessons.html">课程管理</a>
      <a href="questions.html" class="active">题目管理</a>
      <a href="prompts.html">Prompt 管理</a>
      <a href="config.html">模型配置</a>
      <div class="mt-auto p-2">
        <button class="btn btn-sm btn-outline-light w-100" onclick="logout()">退出</button>
      </div>
    </div>

    <div class="flex-grow-1 p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">题目管理</h5>
        <div class="d-flex gap-2">
          <div class="input-group input-group-sm" style="width:220px">
            <select id="genTopic" class="form-select form-select-sm">
              <option value="variables">变量</option>
              <option value="loops">循环</option>
              <option value="functions">函数</option>
              <option value="lists">列表</option>
              <option value="dicts">字典</option>
              <option value="classes">面向对象</option>
              <option value="exceptions">异常处理</option>
            </select>
            <button class="btn btn-outline-primary" onclick="generateQuestion()">AI 生成题目</button>
          </div>
          <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#createModal">+ 手动新增</button>
        </div>
      </div>

      <div class="card">
        <div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr><th>#</th><th>主题</th><th>题目</th><th>正确答案</th><th>难度</th><th></th></tr>
            </thead>
            <tbody id="questionTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 新增题目 Modal -->
  <div class="modal fade" id="createModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title fw-bold" id="modalTitle">新增题目</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editId">
          <div class="row g-2 mb-2">
            <div class="col-6">
              <label class="form-label">主题</label>
              <input id="fTopic" class="form-control" placeholder="variables / loops / functions …">
            </div>
            <div class="col-3">
              <label class="form-label">难度</label>
              <select id="fDiff" class="form-select">
                <option value="1">1 - 简单</option>
                <option value="2">2 - 中等</option>
              </select>
            </div>
            <div class="col-3">
              <label class="form-label">正确答案</label>
              <select id="fAnswer" class="form-select">
                <option>A</option><option>B</option><option>C</option><option>D</option>
              </select>
            </div>
          </div>
          <div class="mb-2">
            <label class="form-label">题目</label>
            <textarea id="fText" class="form-control" rows="2"></textarea>
          </div>
          <div class="mb-2">
            <label class="form-label">选项（每行一个，格式：A. 内容）</label>
            <textarea id="fOptions" class="form-control font-monospace" rows="4" placeholder="A. 选项一&#10;B. 选项二&#10;C. 选项三&#10;D. 选项四"></textarea>
          </div>
          <div id="formError" class="alert alert-danger d-none small"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button class="btn btn-primary" id="saveBtn" onclick="saveQuestion()">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const TOKEN = localStorage.getItem('admin_token')
    if (!TOKEN) location.href = 'index.html'
    const H = { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' }
    const modal = new bootstrap.Modal(document.getElementById('createModal'))
    async function apiFetch(path, opts = {}) {
      const res = await fetch(path, { ...opts, headers: H })
      if (res.status === 401) { localStorage.removeItem('admin_token'); location.href = 'index.html' }
      if (!res.ok) throw new Error(await res.text())
      return res.json()
    }
    function logout() { localStorage.removeItem('admin_token'); location.href = 'index.html' }

    async function loadQuestions() {
      const data = await apiFetch('/admin/questions')
      document.getElementById('questionTable').innerHTML = data.map(q => `
        <tr>
          <td class="text-muted">${q.id}</td>
          <td><span class="badge bg-secondary">${q.topic}</span></td>
          <td class="small">${q.text}</td>
          <td>${q.options.map((o,i) => `<span class="${'ABCD'[i]===q.answer?'option-correct':''}">${o}</span>`).join('<br>')}</td>
          <td>${q.difficulty === 1 ? '简单' : '中等'}</td>
          <td class="d-flex gap-1">
            <button class="btn btn-sm btn-outline-secondary" onclick="editQuestion(${q.id})">编辑</button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteQuestion(${q.id})">删除</button>
          </td>
        </tr>`).join('')
    }

    async function generateQuestion() {
      const topic = document.getElementById('genTopic').value
      const btn = event.target
      btn.disabled = true; btn.textContent = '生成中…'
      try {
        await apiFetch(`/admin/questions/generate?topic=${topic}`, { method: 'POST' })
        await loadQuestions()
      } catch(e) {
        alert('生成失败：' + e.message)
      } finally {
        btn.disabled = false; btn.textContent = 'AI 生成题目'
      }
    }

    let _allQuestions = []
    async function editQuestion(id) {
      if (!_allQuestions.length) _allQuestions = await apiFetch('/admin/questions')
      const q = _allQuestions.find(x => x.id === id)
      if (!q) return
      document.getElementById('editId').value = id
      document.getElementById('fTopic').value = q.topic
      document.getElementById('fDiff').value = q.difficulty
      document.getElementById('fAnswer').value = q.answer
      document.getElementById('fText').value = q.text
      document.getElementById('fOptions').value = q.options.join('\n')
      document.getElementById('modalTitle').textContent = '编辑题目'
      document.getElementById('formError').classList.add('d-none')
      modal.show()
    }

    function openCreate() {
      document.getElementById('editId').value = ''
      document.getElementById('fTopic').value = ''
      document.getElementById('fText').value = ''
      document.getElementById('fOptions').value = ''
      document.getElementById('fDiff').value = '1'
      document.getElementById('fAnswer').value = 'A'
      document.getElementById('modalTitle').textContent = '新增题目'
      document.getElementById('formError').classList.add('d-none')
    }
    document.querySelector('[data-bs-target="#createModal"]').addEventListener('click', openCreate)

    async function saveQuestion() {
      const id = document.getElementById('editId').value
      const topic = document.getElementById('fTopic').value.trim()
      const text = document.getElementById('fText').value.trim()
      const options = document.getElementById('fOptions').value.trim().split('\n').map(s => s.trim()).filter(Boolean)
      const answer = document.getElementById('fAnswer').value
      const difficulty = parseInt(document.getElementById('fDiff').value)
      const errEl = document.getElementById('formError')
      if (!topic || !text || options.length < 2) {
        errEl.textContent = '主题、题目、选项不能为空，且选项至少 2 个'; errEl.classList.remove('d-none'); return
      }
      errEl.classList.add('d-none')
      const btn = document.getElementById('saveBtn')
      btn.disabled = true; btn.textContent = '保存中…'
      try {
        const body = { topic, text, options, answer, difficulty }
        if (id) {
          await apiFetch(`/admin/questions/${id}`, { method: 'PUT', body: JSON.stringify(body) })
        } else {
          await apiFetch('/admin/questions', { method: 'POST', body: JSON.stringify(body) })
        }
        modal.hide()
        _allQuestions = []
        await loadQuestions()
      } catch(e) {
        errEl.textContent = '保存失败：' + e.message; errEl.classList.remove('d-none')
      } finally {
        btn.disabled = false; btn.textContent = '保存'
      }
    }

    async function deleteQuestion(id) {
      if (!confirm(`确定删除题目 #${id}？`)) return
      try {
        await apiFetch(`/admin/questions/${id}`, { method: 'DELETE' })
        _allQuestions = []
        await loadQuestions()
      } catch(e) {
        alert('删除失败：' + e.message)
      }
    }

    loadQuestions()
  </script>
</body>
</html>
