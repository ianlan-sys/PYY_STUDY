<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用户管理 — 管理后台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .sidebar { width: 200px; min-height: 100vh; background: #1e3a5f; }
    .sidebar a { color: rgba(255,255,255,0.75); text-decoration: none; display: block; padding: 10px 16px; border-radius: 6px; margin: 2px 8px; }
    .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,0.15); color: #fff; }
    .brand { color: #fff; font-weight: 700; padding: 20px 16px 12px; font-size: 0.9rem; }
  </style>
</head>
<body class="bg-light">
  <div class="d-flex">
    <div class="sidebar d-flex flex-column">
      <div class="brand">Python 管理台</div>
      <a href="dashboard.html">数据统计</a>
      <a href="users.html" class="active">用户管理</a>
      <a href="sessions.html">会话管理</a>
      <a href="lessons.html">课程管理</a>
      <a href="questions.html">题目管理</a>
      <a href="prompts.html">Prompt 管理</a>
      <a href="config.html">模型配置</a>
      <div class="mt-auto p-2">
        <button class="btn btn-sm btn-outline-light w-100" onclick="logout()">退出</button>
      </div>
    </div>
    <div class="flex-grow-1 p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">用户管理</h5>
        <div class="d-flex gap-2">
          <input id="searchInput" class="form-control form-control-sm" placeholder="按昵称搜索…" style="width:200px">
          <button class="btn btn-sm btn-primary" onclick="loadUsers(1)">搜索</button>
        </div>
      </div>
      <div class="card">
        <div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr><th>openid</th><th>昵称</th><th>等级</th><th>积分</th><th>会话数</th><th>注册时间</th></tr>
            </thead>
            <tbody id="userTableBody"></tbody>
          </table>
        </div>
      </div>
      <nav class="mt-3"><ul class="pagination pagination-sm justify-content-end" id="pagination"></ul></nav>
    </div>
  </div>
  <script>
    const TOKEN = localStorage.getItem('admin_token')
    if (!TOKEN) location.href = 'index.html'
    const H = { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' }
    async function apiFetch(path, opts = {}) {
      const res = await fetch(path, { ...opts, headers: H })
      if (res.status === 401) { localStorage.removeItem('admin_token'); location.href = 'index.html' }
      if (!res.ok) throw new Error(await res.text())
      return res.json()
    }
    function logout() { localStorage.removeItem('admin_token'); location.href = 'index.html' }
    const LEVEL_MAP = { beginner: '初级', intermediate: '中级', advanced: '进阶' }
    async function loadUsers(page = 1) {
      const q = document.getElementById('searchInput').value.trim()
      const data = await apiFetch(`/admin/users?page=${page}${q ? '&q=' + encodeURIComponent(q) : ''}`)
      document.getElementById('userTableBody').innerHTML = data.items.map(u => `
        <tr>
          <td class="text-muted small font-monospace">${u.openid.slice(0,12)}…</td>
          <td>${u.nickname}</td>
          <td><span class="badge bg-secondary">${LEVEL_MAP[u.level] || u.level}</span></td>
          <td>${u.points}</td>
          <td>${u.session_count}</td>
          <td class="small text-muted">${u.created_at.slice(0,10)}</td>
        </tr>`).join('')
      const pages = Math.ceil(data.total / 20)
      const pag = document.getElementById('pagination')
      pag.innerHTML = ''
      for (let i = 1; i <= Math.min(pages, 10); i++)
        pag.innerHTML += `<li class="page-item ${i===page?'active':''}"><a class="page-link" href="#" onclick="loadUsers(${i})">${i}</a></li>`
    }
    document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') loadUsers(1) })
    loadUsers(1)
  </script>
</body>
</html>
